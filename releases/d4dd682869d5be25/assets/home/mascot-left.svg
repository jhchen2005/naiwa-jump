<svg xmlns="http://www.w3.org/2000/svg" width="205.815424" height="370" viewBox="76 57 440 791" data-content-bounds="76 57 440 791" role="img" aria-labelledby="left-title" overflow="hidden">
  <title id="left-title">奶娃 · 侧身抱肚</title>
  <desc>依据人物四视图生成的透明 PNG 人物图层；文字和布局可编辑，人物并非矢量路径。统一可见高度为 370。</desc>

  <defs>
